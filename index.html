<style>/* Layout: the map fills the screen; frosted glass panels float over it. iPhone: top bar, bottom sheet with three heights, floating tab bar. Mac: top bar, floating side panel; Table widens it. Apple system font throughout. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --display:var(--font-d); --body:var(--font);
  --ink:#1C1C1E; --ink-2:rgba(60,60,67,.78); --ink-3:rgba(60,60,67,.58); --rule:rgba(60,60,67,.16);
  --paper:#F2F2F7; --surface:rgba(255,255,255,.86); --surface-2:rgba(118,118,128,.12);
  --glass:rgba(250,250,252,.66); --glass-2:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.7); --shadow:0 10px 40px rgba(20,30,50,.16),0 1px 3px rgba(20,30,50,.08);
  --enamel:#007AFF; --on-enamel:#FFFFFF; --focus:#007AFF; --info:#007AFF; --info-bg:rgba(0,122,255,.10);
  --ok:#248A3D; --ok-bg:rgba(52,199,89,.14); --warn:#B25000; --warn-bg:rgba(255,149,0,.16); --bad:#D70015; --bad-bg:rgba(255,59,48,.12);
  --gold:#E0A100; --glyph:#FFFFFF;
  --c-nature:#28A745; --c-history:#9C7A54; --c-pub:#F08C00; --c-food:#E5375B; --c-village:#7D7D85; --c-museum:#A34FD6; --c-trip:#5856D6;
  --m-land:#F4F1EA; --m-built:#EAE5DC; --m-wood:#CDE3BF; --m-water:#A9D2EE; --m-river:#8FC2E5; --m-case:#FFFFFF; --m-canal:#3A8FD6; --m-route:#0A84FF;
  --m-motorway:#F5C46C; --m-trunk:#F8D58F; --m-primary:#FCE3AC; --m-secondary:#FFFFFF; --m-tertiary:#FFFFFF; --m-minor:#FFFFFF; --m-roadedge:#D8D2C6; --m-rail:#B9B3A8; --m-halo:#F4F1EA;
  --tabbar:64px; --panel:420px; --gap:12px;
}

  --ok:#30D158; --ok-bg:rgba(48,209,88,.16); --warn:#FF9F0A; --warn-bg:rgba(255,159,10,.16); --bad:#FF453A; --bad-bg:rgba(255,69,58,.16);
  --gold:#FFC93C;

  --ink:#F2F2F7; --ink-2:rgba(235,235,245,.74); --ink-3:rgba(235,235,245,.52); --rule:rgba(84,84,88,.55);

  --enamel:#0A84FF; --on-enamel:#FFFFFF; --focus:#64A8FF; --info:#64A8FF; --info-bg:rgba(10,132,255,.18);

  --gold:#FFC93C;

  --m-land:#222428; --m-built:#2B2E33; --m-wood:#1F3327; --m-water:#1D3953; --m-river:#2A4F72; --m-case:#222428; --m-canal:#4FA3E8; --m-route:#0A84FF;
  --m-motorway:#7A6235; --m-trunk:#695838; --m-primary:#584E3E; --m-secondary:#3E4248; --m-tertiary:#383B41; --m-minor:#33363B; --m-roadedge:#191B1F; --m-rail:#575B63; --m-halo:#222428;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;max-width:100%}
body{background:var(--m-land);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--font-d);line-height:1.15;text-wrap:balance}
h2{font-size:28px;font-weight:700;letter-spacing:-.02em}
h3{font-size:20px;font-weight:600;letter-spacing:-.01em}
p{margin:0}
a{color:var(--enamel);text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.cap{font-size:13px;line-height:18px;color:var(--ink-3)}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:17px;height:17px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--glass-line);box-shadow:var(--shadow)}

/* shell: everything floats over a full-screen map */
.shell{position:relative;height:100dvh;overflow:hidden}
.main{position:absolute;inset:0}
#map{position:absolute;inset:0;z-index:1;background:var(--m-land)}
.leaflet-container{font-family:var(--font);background:var(--m-land)}
.leaflet-control-attribution{font-size:10px;background:var(--glass)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink-2);border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:var(--enamel)}
.strip{position:absolute;z-index:1200;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 6px 6px 16px;border-radius:20px;min-width:0;
  background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.brand{display:flex;flex-direction:column;line-height:1.1;flex:none}
.brand b{font-family:var(--font-d);font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink-3)}
.status{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:0;padding:0 0 0 10px;text-align:left;border-left:1px solid var(--rule)}
.status .bar{width:10px;height:10px;border-radius:50%;background:var(--ink-3);flex:none}
.status.ok .bar{background:#34C759}.status.warn .bar{background:#FF9500}.status.bad .bar{background:#FF3B30}
.status .txt{min-width:0;display:flex;flex-direction:column}
.status .l1{font-weight:600;font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .l2{font-size:13px;line-height:17px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipd{flex:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:12px;background:var(--surface-2);white-space:nowrap}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:14px;background:var(--surface-2);flex:none}

/* map buttons */
.mapctl{position:absolute;z-index:900;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;border-radius:16px;overflow:hidden;transition:opacity .2s;
  background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.mapctl button{width:46px;height:46px;display:grid;place-items:center;border:0;background:none;color:var(--ink)}
.mapctl button+button{border-top:1px solid var(--rule)}
.mapctl button.on{color:var(--enamel)}
.layerpop{position:absolute;z-index:1150;max-height:calc(100dvh - 200px);overflow:auto;right:calc(max(12px,env(safe-area-inset-right,0px)) + 56px);top:calc(env(safe-area-inset-top,0px) + 80px);padding:6px;display:grid;min-width:240px;max-width:calc(100vw - 100px);border-radius:16px;
  background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.layerpop label{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 10px;font-size:15px;border-radius:10px}
.layerpop input[type=checkbox]{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--surface-2);position:relative;flex:none;transition:background .2s}
.layerpop input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.layerpop input[type=checkbox]:checked{background:#34C759}
.layerpop input[type=checkbox]:checked::after{transform:translateX(18px)}

/* panel: bottom sheet on iPhone, floating side panel on Mac */
.panel{position:absolute;z-index:1000;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 76px + var(--sy,40vh));bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 18px);
  display:flex;flex-direction:column;border-radius:26px;overflow:hidden;
  background:var(--glass);-webkit-backdrop-filter:blur(32px) saturate(180%);backdrop-filter:blur(32px) saturate(180%);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.panel.anim{transition:top .32s cubic-bezier(.2,.9,.25,1)}
.handle{flex:none;display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 8px 4px 16px;touch-action:none;cursor:grab;user-select:none;position:relative}
.handle .grip{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:38px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.5}
.handle .peekrow{display:flex;gap:8px;min-width:0;flex:1;overflow:hidden;padding-top:8px}
.handle .peekrow .pk{flex:none;font-size:14px;font-weight:600;padding:5px 10px;border-radius:10px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.handle .iconbtn{background:none}
.pbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 16px 28px;-webkit-overflow-scrolling:touch}
.tabbar{display:flex;justify-content:space-around;align-items:center;z-index:1200}
.tabbar.outside{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(520px,calc(100vw - 20px));height:var(--tabbar);padding:0 6px;border-radius:32px;
  background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.tabbar button{flex:1;min-width:0;height:54px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--ink-2);border-radius:26px}
.tabbar button[aria-selected="true"]{color:var(--enamel);background:var(--surface-2);font-weight:600}
@media (min-width:768px){
  .panel{left:max(12px,env(safe-area-inset-left,0px));right:auto;width:var(--panel);top:calc(env(safe-area-inset-top,0px) + 80px)!important;bottom:12px;border-radius:22px}
  .handle{display:none}
  .tabbar.outside{display:none}
  .tabbar.inside{display:flex;margin:10px 10px 0;padding:4px;border-radius:14px;background:var(--surface-2);gap:2px}
  .tabbar.inside button{flex-direction:row;gap:6px;height:36px;font-size:13px;border-radius:10px}
  .tabbar.inside button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .tabbar.inside button[data-tab="map"]{display:none}
  .main.wide .panel{width:auto;right:12px}
  .main.wide .mapctl{display:none}
  .pbody{padding:0 18px 28px}
  .mapctl,.layerpop{top:calc(env(safe-area-inset-top,0px) + 80px)}
}
@media (min-width:1280px){:root{--panel:460px}}
@media (max-width:767px){ .tabbar.inside{display:none} .strip .brand span{display:none} .strip .chipd.route{display:none} #zin,#zout{display:none} .strip{padding-left:14px} .brand b{font-size:17px} }

/* content blocks */
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-top:12px}
.sec>*,.card>*,#wbody>*,.daycard>*{min-width:0}
.card{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-top:10px}
#wbody{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.sticky{position:sticky;top:0;z-index:5;padding-block:8px;margin-inline:-16px;padding-inline:16px;background:linear-gradient(var(--glass-2),var(--glass-2));-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.group{background:var(--glass-2);border-radius:16px;overflow:hidden}
.seg{display:flex;padding:3px;gap:2px;border-radius:12px;background:var(--surface-2)}
.seg button{flex:1;min-height:36px;border:0;background:none;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2);padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.routepick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.routepick button{text-align:left;border:1.5px solid transparent;border-radius:16px;background:var(--glass-2);padding:12px 14px;min-height:64px;display:grid;gap:3px;align-content:start}
.routepick button b{font-size:16px;font-weight:700}
.routepick button span{font-size:13px;color:var(--ink-2);line-height:17px}
.routepick button[aria-pressed="true"]{border-color:var(--enamel);background:var(--info-bg)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.days::-webkit-scrollbar{display:none}
.dayb{flex:none;min-width:54px;height:58px;border:0;border-radius:14px;background:var(--glass-2);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;line-height:1.1;padding:0 8px}
.dayb .dw{font-size:12px;font-weight:600;color:var(--ink-2)}
.dayb .dd{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.dayb[aria-pressed="true"]{background:var(--enamel);color:#fff}
.dayb[aria-pressed="true"] .dw{color:rgba(255,255,255,.85)}
.dayb .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%}
.dot.warn{background:#FF9500}.dot.bad{background:#FF3B30}
.daycard{display:grid;gap:12px;background:var(--glass-2);border-radius:20px;padding:16px}
.daycard h2{font-size:26px}
.daycard .cap:first-child{font-size:13px;font-weight:600;color:var(--enamel)}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--surface-2);border-radius:14px;padding:10px 4px}
.fig{text-align:center;min-width:0}
.fig b{display:block;font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.fig span{font-size:12px;color:var(--ink-3)}
.msg{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 12px;border-radius:14px;align-items:start}
.msg svg{grid-row:span 2;margin-top:1px}
.msg b{font-size:15px;line-height:20px;font-weight:600}
.msg span{font-size:14px;line-height:19px;color:var(--ink-2);grid-column:2}
.msg.ok{background:var(--ok-bg)}.msg.ok svg{color:var(--ok)}
.msg.warn{background:var(--warn-bg)}.msg.warn svg{color:var(--warn)}
.msg.bad{background:var(--bad-bg)}.msg.bad svg{color:var(--bad)}
.msg.info{background:var(--info-bg)}.msg.info svg{color:var(--info)}
.btn{min-height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;color:var(--enamel)}
.btn.primary{background:var(--enamel);color:#fff}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.link{background:none;padding:0 4px}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.field{display:grid;gap:6px;min-width:0}
.field select,.field input[type=time],.field input[type=number],.search{min-height:44px;border:0;border-radius:12px;background:var(--surface-2);padding:0 12px;min-width:0;width:100%;font-size:16px}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}
.stepper button{height:44px;border:0;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:15px;color:var(--enamel)}
.stepper input{text-align:center;font-size:20px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 13px;border:0;border-radius:18px;background:var(--surface-2);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--enamel);color:#fff}
.vchip{display:inline-flex;align-items:center;gap:4px;min-height:36px;border-radius:18px;background:var(--surface-2);padding:0 4px 0 12px;font-size:14px;max-width:100%}
.vchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vchip button{width:30px;height:30px;border:0;background:none;display:grid;place-items:center;color:var(--ink-3)}
/* timeline */
.tl{display:grid;background:var(--glass-2);border-radius:18px;padding:4px 12px}
.tlr{display:grid;grid-template-columns:50px 26px minmax(0,1fr);gap:0 8px;min-height:50px;align-items:start;padding-block:9px;border:0;background:none;text-align:left;width:100%;position:relative}
.tlr+.tlr{border-top:1px solid var(--rule)}
.tlr .tt{font-weight:600;font-size:15px;padding-top:1px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tlr .rail{position:relative;align-self:stretch;display:grid;justify-items:center}
.tlr .rail::before{content:"";position:absolute;top:-9px;bottom:-9px;width:3px;border-radius:2px;background:var(--m-route);opacity:.35}
.tlr .node{position:relative;z-index:1;margin-top:1px}
.tlr .nm{font-size:16px;line-height:21px;min-width:0;font-weight:500}
.tlr .sub{display:block;font-size:13px;line-height:18px;color:var(--ink-3);font-weight:400}
.tlr .notes{display:block;font-size:13px;line-height:18px;color:var(--warn);font-weight:600}
.tlr .sights{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:13px;color:var(--ink-2);font-weight:400}
.tlr .sights i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.tlr.minor{min-height:36px;padding-block:6px}
.tlr.minor .nm{font-size:14px;color:var(--ink-2)}
.nodeic{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:2px solid var(--m-route);font-weight:700;font-size:10px;color:var(--ink);font-variant-numeric:tabular-nums}
.nodeic svg{width:12px;height:12px}
.nodeic.lock{border-radius:6px;background:#3A3A3C;border-color:#3A3A3C}
.nodeic.end{background:var(--m-route);color:#fff;border-color:#fff;font-size:12px;width:24px;height:24px;box-shadow:0 0 0 2px var(--m-route)}
/* lists */
.list{display:grid;background:var(--glass-2);border-radius:16px;overflow:hidden}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;min-height:56px;padding:8px 14px;border:0;background:none;text-align:left;width:100%}
.li+.li{border-top:1px solid var(--rule)}
.li .t{font-size:16px;line-height:21px;font-weight:500}
.li .s{display:block;font-size:13px;line-height:18px;color:var(--ink-3)}
.li .r{font-size:14px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.plaque{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.plaque svg{width:17px;height:17px}
/* variations */
.fork{display:grid;gap:8px;padding-top:6px}
.fork h3{font-size:17px;font-weight:600}
.opt{display:grid;grid-template-columns:26px minmax(0,1fr);gap:3px 10px;align-items:start;min-height:56px;border:1.5px solid transparent;border-radius:16px;background:var(--glass-2);padding:12px 14px;text-align:left;width:100%}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-3);margin-top:1px;display:grid;place-items:center}
.opt[aria-checked="true"]{border-color:var(--enamel);background:var(--info-bg)}
.opt[aria-checked="true"] .radio{border-color:var(--enamel);background:var(--enamel)}
.opt[aria-checked="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt b{font-size:16px;font-weight:600}
.opt .d{grid-column:2;font-size:14px;color:var(--ink-2);line-height:19px}
.opt .delta{grid-column:2;font-size:13px;font-weight:600;color:var(--enamel);font-variant-numeric:tabular-nums}
.daysrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;min-height:60px;padding:8px 14px;border:0;background:none;text-align:left;width:100%}
.daysrow+.daysrow{border-top:1px solid var(--rule)}
.daysrow .dn{font-weight:700;font-size:15px;line-height:1.15}
.daysrow .tr{font-size:15px;line-height:20px;min-width:0}
.daysrow .fg{font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.compare>button{background:var(--glass-2);padding:14px;min-width:0;border:1.5px solid transparent;border-radius:18px;text-align:left;display:grid;gap:4px;align-content:start}
.compare b{font-size:17px;font-weight:700}
.compare .k{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.compare>button[aria-pressed="true"]{border-color:var(--enamel);background:var(--info-bg)}
/* place and sight pages */
.plate{display:flex;align-items:center;gap:12px;font-family:var(--font-d);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
.plate .num{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 8px;border-radius:10px;background:var(--surface-2);font-size:17px;font-weight:700;letter-spacing:0}
.plate.cat svg{width:44px;height:44px;padding:11px;border-radius:50%;background:var(--catc,var(--enamel));color:#fff;flex:none;box-sizing:border-box;stroke-width:2}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:13px;font-weight:500;border-radius:10px;padding:5px 10px;background:var(--surface-2)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.tag.ok{color:var(--ok)}.tag.not{color:var(--warn)}
.tag.not::before,.tag.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;border:0;background:none;color:var(--enamel);font-weight:500;font-size:17px;padding:0;margin-left:-6px;justify-self:start}
.stars{color:var(--gold);font-size:17px;letter-spacing:1px;white-space:nowrap;line-height:1}
.stars .off{opacity:.22}
.toppick{font-size:12px;font-weight:700;background:var(--gold);color:#3A2A00;padding:4px 9px;border-radius:9px}
.why{font-weight:600;font-size:16px;line-height:22px;background:color-mix(in srgb,var(--gold) 16%,transparent);border-radius:14px;padding:10px 12px}
.lead{font-size:18px;line-height:25px}
.kv{display:grid;grid-template-columns:minmax(0,1fr);gap:0;background:var(--glass-2);border-radius:16px;overflow:hidden;margin:0}
.kv dt{font-size:13px;font-weight:600;color:var(--ink-3);padding:10px 14px 0}
.kv dd{margin:0;font-size:15px;line-height:21px;padding:2px 14px 10px;border-bottom:1px solid var(--rule)}
.kv dd:last-child{border-bottom:0}
ul.plain{margin:0;padding:10px 14px 10px 30px;display:grid;gap:6px;background:var(--glass-2);border-radius:16px;font-size:15px;line-height:21px}
/* table */
.tablewrap{overflow:auto;border-radius:16px;background:var(--glass-2);max-height:calc(100dvh - 320px);min-height:300px}
table.rt{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;min-width:960px}
table.rt th{position:sticky;top:0;background:var(--surface);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);text-align:left;font-weight:600;font-size:12px;color:var(--ink-3);padding:10px 8px;border-bottom:1px solid var(--rule);z-index:2}
table.rt td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
table.rt td.n{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
table.rt td.cn{white-space:nowrap;color:var(--ink-2)}
table.rt tr.dayhead td{background:var(--info-bg);color:var(--ink);font-weight:700;font-size:14px;padding:10px 8px}
table.rt tr.dayhead td.sticky1{background:var(--surface);color:var(--enamel)}
table.rt tr.minor td{color:var(--ink-3)}
table.rt tr.key td:nth-child(2){font-weight:600}
table.rt tbody tr:not(.dayhead){cursor:pointer}
table.rt tbody tr:not(.dayhead):hover td{background:var(--info-bg)}
table.rt .sticky1{position:sticky;left:0;background:var(--surface);z-index:1}
table.rt th.sticky1{z-index:3}
table.rt .warnc{color:var(--warn);font-weight:600}
.phones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.phones div{border-radius:16px;padding:12px 14px;background:var(--glass-2)}
.phones b{font-size:20px;font-weight:700;user-select:all;display:block;font-variant-numeric:tabular-nums}
.snack{position:fixed;left:50%;transform:translateX(-50%);white-space:nowrap;min-width:min(320px,calc(100vw - 32px));justify-content:space-between;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 22px);z-index:2000;border-radius:16px;min-height:48px;display:flex;align-items:center;gap:12px;padding:0 6px 0 16px;max-width:calc(100vw - 32px);font-size:15px;
  background:rgba(30,30,32,.86);color:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.snack button{min-height:40px;border:0;background:none;color:#64A8FF;font-weight:600}
@media (min-width:768px){.snack{bottom:20px}}
/* map markers: round pins like Apple Maps */
.mk{display:grid;place-items:center}
.mk .v{display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);color:#fff;border-radius:50%}
.mk svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mk.lock .v{width:18px;height:18px;border-radius:5px;background:#3A3A3C}
.mk.lock .v::before{content:"";width:8px;height:8px;border-left:2px solid #fff;border-right:2px solid #fff}
.mk.bridge .v{min-width:22px;height:18px;padding:0 4px;border-radius:9px;background:#fff;border:1px solid rgba(0,0,0,.18);color:#1C1C1E;font-weight:700;font-size:10.5px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mk.turn .v{width:22px;height:22px;background:#5E5CE6}
.mk.moor .v{width:22px;height:22px;background:#0A84FF}
.mk.service .v{width:22px;height:22px;background:#32ADE6}
.mk.pub .v{width:22px;height:22px;background:#F08C00}
.mk.junction .v{width:14px;height:14px;background:#fff;border:3px solid #636366}
.mk.tunnel .v{width:22px;height:22px;background:#48484A}
.mk.sight .v{width:30px;height:30px}
.mk.sight.top .v{width:36px;height:36px;box-shadow:0 0 0 3px var(--gold),0 2px 8px rgba(0,0,0,.35)}
.mk.sight.not .v{opacity:.92}
.mk.night .v{width:30px;height:30px;background:#0A84FF;color:#fff;border:3px solid #fff;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mk.night.cur .v{width:36px;height:36px;font-size:17px;background:#FF9500}
.medot{display:block;width:22px;height:22px;border-radius:50%;background:#0A84FF;border:4px solid #fff;box-shadow:0 0 0 6px rgba(10,132,255,.2),0 2px 6px rgba(0,0,0,.35)}
.plabel{font-family:var(--font);color:var(--ink);white-space:nowrap;text-shadow:0 0 2px var(--m-halo),0 0 2px var(--m-halo),0 0 4px var(--m-halo),0 0 6px var(--m-halo);pointer-events:none;transform:translate(-50%,-50%);display:inline-block}
.plabel.town{font-weight:700;font-size:15px;letter-spacing:.01em}
.plabel.village{font-weight:600;font-size:13px}
.plabel.hamlet{font-size:12px;color:var(--ink-2)}
.leaflet-div-icon{background:none;border:0}
.leaflet-tooltip{font-family:var(--font);border:0;border-radius:10px;box-shadow:var(--shadow);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500}
@media (prefers-reduced-motion:reduce){.panel.anim{transition:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--glass:var(--paper);--glass-2:var(--surface)}}

.tlr.br{min-height:32px;padding-block:5px;align-items:center}
.tlr.br .tt{font-size:13px;font-weight:500;color:var(--ink-3);padding-top:0}
.tlr.br .nm{font-size:14px;color:var(--ink-2);font-weight:400}
.brnum{display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 6px 0 4px;border-radius:10px;background:var(--surface);border:1px solid var(--rule);font-size:11px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:-8px}
.brnum svg{width:12px;height:12px;stroke-width:2.2}

  if(/Marina|Wharf|Boats|Services|Moorings|Stop$|Water Point|Sanitary/.test(s)) return "service";

NODES.forEach(n=>{n.k=kindOf(n);});
const bridgeNo=s=>{const m=s.match(/(?:Bridge No |Bridges No )(\d+[A-Z]?)/);return m?m[1]:"";};
const canTurn=n=>/Winding Hole|Terminal Basin|Junction$|^Braunston Turn$|Wharf Dock/.test(n.n);
function path(a,b){
  if(a===b) return [a];
  const prev={[a]:null}, q=[a];
  while(q.length){const x=q.shift(); if(x===b) break; for(const e of ADJ[x]) if(!(e.to in prev)){prev[e.to]=x;q.push(e.to);}}
  if(!(b in prev)) return null;
  const out=[]; for(let x=b;x!==null;x=prev[x]) out.push(x); return out.reverse();
}
const edge=(a,b)=>ADJ[a].find(e=>e.to===b);
const MI=1609.34;
const toMin=s=>{const [h,m]=String(s).split(":").map(Number);return (h||0)*60+(m||0);};
const fmt=m=>{m=Math.round(m);m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");};
const dur=m=>{m=Math.max(0,Math.round(m));return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";};
function km(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;const h=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function edgeTime(e,pace){const broad=WW[e.w].type==="broad";return e.dm/MI/(broad?pace.b:pace.n)*60+e.dl*(broad?pace.lw:pace.ln);}

/* Build a 7-day plan from a route, its chosen variations and the user's overrides. */
function composePlan(route, choice, over){
  const days=route.days.map(d=>({...d,via:[...d.via]}));
  for(const g of route.groups){
    const opt=g.opts.find(o=>o.id===(choice&&choice[g.id]))||g.opts[0];
    if(opt.patch) for(const di in opt.patch) Object.assign(days[di],JSON.parse(JSON.stringify(opt.patch[di])));
  }
  if(over) for(const di in over) Object.assign(days[di],JSON.parse(JSON.stringify(over[di])));
  return days;
}

/* Simulate the week. Returns per-day results with a timed step list. */
function simulate(days, pace){
  const res=[]; let prevTail=null; let from=byName("Clifton Wharf").id;
  days.forEach((d,di)=>{
    const msgs=[]; let replanned=false;
    if(d.from&&byName(d.from)){from=byName(d.from).id;prevTail=null;replanned=true;}
    const stops=[...(d.via||[]),d.night].map(byName).filter(Boolean);
    let seq=[from], ok=true;
    for(const st of stops){const p=path(seq[seq.length-1],st.id); if(!p){ok=false;break;} seq=seq.concat(p.slice(1));}
    const turns=[];
    for(let i=1;i<seq.length-1;i++) if(seq[i-1]===seq[i+1]){const n=BYID[seq[i]]; turns.push(seq[i]); if(!canTurn(n)) msgs.push({k:"warn",lead:"No turning place at "+n.n,t:"Canalplan lists no winding hole there. Ask Clifton, or turn at a listed winding hole."});}
    if(prevTail&&seq.length>1&&seq[1]===prevTail){const n=BYID[seq[0]]; if(canTurn(n)) turns.push(seq[0]); else msgs.push({k:"warn",lead:"You must turn round at "+n.n,t:"It is not a listed turning place. Turn the evening before at a winding hole."});}
    let t=toMin(d.start); const startT=t; let meters=0,locks=0,cruise=0,wait=0;
    const steps=[{id:seq[0],t,m:0,l:0,notes:[]}]; const entered={}, lastT={}, flightLog=[];
    for(let i=1;i<seq.length;i++){
      const a=seq[i-1],b=seq[i],e=edge(a,b),na=BYID[a],nb=BYID[b]; let inF=null; const notes=[];
      if(e.dl>0){
        for(const f of FLIGHTS){ if(!(f.re.test(na.n)||f.re.test(nb.n))) continue; inF=f; if(entered[f.key]) continue; entered[f.key]=true;
          const r=f.rule(di);
          if(r&&r.closed){msgs.push({k:"bad",lead:f.name+" is closed",t:r.closed}); notes.push("Closed: "+f.name);}
          else if(r){ if(t<r.open-1){wait+=r.open-t; notes.push("Wait "+Math.round(r.open-t)+" min for "+f.name+" to open at "+fmt(r.open)); msgs.push({k:"info",lead:"Wait "+Math.round(r.open-t)+" min at "+f.name,t:"It opens at "+fmt(r.open)+"."}); t=r.open;}
            if(t>r.last){msgs.push({k:"bad",lead:"Too late for "+f.name,t:"You arrive at "+fmt(t)+"; last entry is "+fmt(r.last)+"."}); notes.push("Missed last entry "+fmt(r.last));}
            else {flightLog.push({f,t,r}); notes.push(f.name+": in at "+fmt(t)+(r.last<2000?", last entry "+fmt(r.last):"")+(r.note?" ("+r.note+")":""));}}
        }
      }
      const ct=edgeTime(e,pace); t+=ct; cruise+=ct; meters+=e.dm; locks+=e.dl;
      if(inF) lastT[inF.key]=t;
      if(turns.includes(b)&&i<seq.length-1) notes.push("Turn the boat here");
      steps.push({id:b,t,m:meters,l:locks,notes,w:e.w});
    }
    for(const f of FLIGHTS){ if(!lastT[f.key]) continue; const r=f.rule(di); if(r&&r.close&&lastT[f.key]>r.close) msgs.push({k:"warn",lead:"Still in "+f.name+" at closing",t:"You finish about "+fmt(lastT[f.key])+"; it closes at "+fmt(r.close)+". Start earlier."}); }
    const wide=steps.slice(1).reduce((s,x,k)=>s+(WW[x.w].type==="broad"?Math.abs(edge(seq[k],x.id).dl):0),0);
    if(wide>=14) msgs.push({k:"warn",lead:"Long lock day: "+wide+" wide locks",t:"Swap the wheel often and pick a fallback stop."});
    const arrive=t+(d.brk||0); const [sr,ss]=SUN[di];
    if(startT<sr-25) msgs.push({k:"warn",lead:"Start before first light",t:"You set off at "+fmt(startT)+"; light from about "+fmt(sr-25)+"."});
    if(arrive>ss) msgs.push({k:"bad",lead:"Arrive after dark",t:"About "+fmt(arrive)+"; sunset "+fmt(ss)+". Do not cruise in the dark."});
    else if(arrive>ss-35) msgs.push({k:"warn",lead:"Tight on daylight",t:"Arrive about "+fmt(arrive)+"; sunset "+fmt(ss)+". Aim to moor by 16:00."});
    if(di===6){ if(BYID[seq[seq.length-1]].n!=="Clifton Wharf") msgs.push({k:"bad",lead:"Monday must end at Clifton Wharf",t:""}); else if(arrive>570) msgs.push({k:"bad",lead:"Late back to the yard",t:"You arrive "+fmt(arrive)+"; the boat is due by 09:30."}); else msgs.push({k:"ok",lead:"Back at the yard by "+fmt(arrive),t:"Due by 09:30, off the boat by 10:00."}); }
    if(di===0&&startT<840) msgs.push({k:"info",lead:"Needs an early handover",t:"Clifton's website says boats go out after 14:00. Ask them for "+d.start+"."});
    if(replanned) msgs.unshift({k:"info",lead:"Replanned from "+d.from,t:"Starting at "+d.start+"."});
    if(!ok) msgs.push({k:"bad",lead:"No route to a stop",t:""});
    if(di<6&&meters===0) msgs.push({k:"warn",lead:"No cruising today",t:"The night stop is where you already are. Pick another night stop or a different variation."});
    flightLog.forEach(x=>msgs.push({k:"ok",lead:x.f.name+": in at "+fmt(x.t),t:x.r.last<2000?"Window "+fmt(x.r.open)+" to "+fmt(x.r.last)+" last entry.":"Open."}));
    const order={bad:0,warn:1,info:2,ok:3}; msgs.sort((a,b)=>order[a.k]-order[b.k]);

  });

}

        return `<div class="li" style="grid-template-columns:auto minmax(0,1fr) auto"><button class="plaque" style="background:var(${p.cv});border:0" data-ct="${p.type}" data-cid="${p.id}">${ico(p.icon)}</button>
        <button style="border:0;background:none;text-align:left;padding:0;min-width:0" data-ct="${p.type}" data-cid="${p.id}"><span class="t">${esc(p.name)}</span><span class="s">Leave the boat at ${esc(shortName(BYID[ns.s.id].n))} about ${fmt(ns.s.t)} · ${ns.d.toFixed(1)} km walk</span></button>
        <span class="row" style="gap:4px;flex-wrap:nowrap">${onRoute?`<span class="cap">Stop set</span>`:`<button class="btn small" data-stop="${esc(BYID[ns.s.id].n)}">Stop here</button>`}<button class="iconbtn" data-unpick="${esc(k)}" aria-label="Remove">${ico("x","i s")}</button></span></div>`;}).join("");

   ${(()=>{const seen=new Set(); const tp=[]; r.seq.forEach(id=>nearSights(BYID[id]).forEach(x=>{if(!seen.has(x.p.id)&&starsOf(x.p.id)>=2){seen.add(x.p.id);tp.push(x.p);}})); tp.sort((a,b2)=>starsOf(b2.id)-starsOf(a.id));

   <div class="msg info">${ico("info")}<b>Notes</b><span>${esc(DAYNOTES[i])}</span></div>
  </div>`;
  bindRoutePicker(b); bindDaySel(b);

function addOptions(r){const here=BYID[r.seq[r.seq.length-1]]; const list=NODES.filter(n=>canTurn(n)||NIGHTS.includes(n.n)).map(n=>({n,d:km(here.lat,here.lon,n.lat,n.lon)})).sort((a,b)=>a.d-b.d).slice(0,40);
  return list.map(x=>`<option value="${esc(x.n.n)}">${esc(x.n.n)}${canTurn(x.n)?" (turn)":""}</option>`).join("");}
const nowHM=()=>{const n=new Date();return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");};
function replanFrom(name,time){const i=S.day; change("Replanned day "+(i+1)+" from "+shortName(name),()=>{const d=PLAN[i]; const p=path(byName(name).id,byName(d.night).id)||[]; const via=d.via.filter(v=>p.includes(byName(v)?.id)); S.over[S.route][i]=Object.assign({},S.over[S.route][i]||{},{from:name,start:time,via});}); CARD=null; setTab("today");}

const ANCHOR={}; POI.forEach(p=>{const n=byName(p.near); if(n) (ANCHOR[n.id]=ANCHOR[n.id]||[]).push({p,d:km(n.lat,n.lon,p.lat,p.lon)});});
function nearSights(n){return ANCHOR[n.id]||[];}
/* Checkpoints shown on route lists by default: start, night stop, turns and stops, lock deadlines and waits, moorings, numbered bridges, places by a researched sight. */
function isCheckpoint(n,s,k,r){ if(k===0||k===r.steps.length-1) return true; if(PLAN[r.di].via.includes(n.n)||s.notes.length) return true;
  if(n.k==="lock"||n.k==="moor"||n.k==="turn"||n.k==="tunnel"||(n.k==="bridge"&&bridgeNo(n.n))||QUIET[n.n]) return true; if(nearSights(n).length) return true; if(S.svc&&n.f) return true; return false;}
const bridgeName=s=>s.replace(/\s*(Road |Lane |Lock |Footbridge )?Bridges? No \d+[A-Z]?/,m=>m.match(/Road|Lane|Lock/)?" "+m.trim().split(" ")[0]:"").trim();
function lockInfo(n){const f=FLIGHTS.find(x=>x.re.test(n.n)); const nums=(n.n.match(/Nos? (\d+(?: and \d+)?)/)||[])[1]||""; const wide=WW[n.w].type==="broad";
  const pair=/Locks Nos/.test(n.n)?"paired narrow locks, use either":/Staircase/.test(n.n)?"staircase: the gates of one lock lead straight into the next":wide?"wide lock":"narrow lock";
  return {nums,pair,f};}
function timelineHTML(r,all){ const seenF=new Set();
  return r.steps.map((s,k)=>{const n=BYID[s.id]; const last=k===r.steps.length-1, first=k===0;
    const key=isCheckpoint(n,s,k,r);
    if(!key&&!all) return "";
    const b=bridgeNo(n.n); const sights=nearSights(n).slice(0,3).map(x=>`<span><i style="background:var(--c-${x.p.c})"></i>${esc(x.p.n)}${starsOf(x.p.id)===3?" ★":""}</span>`).join("");
    const notes=s.notes.length?`<span class="notes">${esc(s.notes.join(" · "))}</span>`:"";
    if(!first&&!last&&n.k==="bridge"&&b&&!notes&&!sights&&!QUIET[n.n])
      return `<button class="tlr br" data-node="${n.id}"><span class="tt">${fmt(s.t)}</span><span class="rail"><span class="node"><span class="brnum">${ico("bridge","i s")}${esc(b)}</span></span></span><span class="nm">${esc(bridgeName(n.n)||"Bridge "+b)}</span></button>`;
    let title=esc(n.n), sub=[];
    if(n.k==="lock"){const li=lockInfo(n); sub.push(li.pair); if(li.f&&!seenF.has(li.f.key)){seenF.add(li.f.key); sub.push(li.f.text);}}
    else if(QUIET[n.n]) sub.push("Quiet countryside mooring");
    else sub.push(KINDLABEL[n.k]);
    if(S.svc&&n.f) sub.push(n.f);
    sub.push(`${mi(s.m)} mi, ${s.l} locks so far`);
    const node=first||last?`<span class="nodeic end">${first?"S":r.di+1}</span>`:n.k==="lock"?`<span class="nodeic lock" aria-label="Lock"></span>`:QUIET[n.n]?`<span class="nodeic quiet">${ico("moon","i s")}</span>`:`<span class="nodeic">${ico(KINDICON[n.k]||"dot","i s")}</span>`;
    return `<button class="tlr ${n.k==="lock"?"lk":""} ${key?"":"minor"}" data-node="${n.id}"><span class="tt">${fmt(s.t)}</span><span class="rail"><span class="node">${node}</span></span><span class="nm">${title}<span class="sub">${esc(sub.join(" · "))}</span>${notes}${sights&&key?`<span class="sights">${sights}</span>`:""}</span></button>`;}).join("");}
function bindTimeline(b){b.querySelectorAll("[data-node]").forEach(x=>x.onclick=()=>openCard({type:"node",id:x.dataset.node},true));}

function viewWeek(b){const seg=S.wseg;

  b.querySelectorAll("[data-seg]").forEach(x=>x.onclick=()=>{S.wseg=x.dataset.seg;save();renderPanel();});
  const w=$("#wbody");

    w.innerHTML=`<div class="compare">${both.map(x=>`<button data-route="${x.k}" aria-pressed="${x.k===S.route}"><b>${ROUTES[x.k].name}</b><span class="cap">${esc(ROUTES[x.k].title)}</span><span class="k">${mi(x.t.m)} mi · ${x.t.l} locks</span><span class="k">${dur(x.t.c)} cruising</span><span class="tag ${x.t.bad?"not":"ok"}">${x.t.bad?x.t.bad+" problem"+(x.t.bad>1?"s":""):"All days fit"}${x.t.warn?" · "+x.t.warn+" to check":""}</span></button>`).join("")}</div>
     <p class="muted">${esc(ROUTES[S.route].lede)}</p>
     <div class="list">${RES.map((r,i)=>{const w2=worst(r);return `<button class="daysrow" data-day="${i}"><span class="dn">${DSHORT[i][0]}<br>${DSHORT[i][1]}</span><span class="tr"><b>${esc(shortName(r.night))}</b><span class="cap" style="display:block">${PLAN[i].via.length?"via "+esc(PLAN[i].via.map(shortName).join(", ")):"&nbsp;"}</span>${w2!=="ok"?`<span class="tag not">${w2==="bad"?"problem":"check"}</span>`:""}${S.over[S.route][i]?` <span class="tag ok">changed</span>`:""}</span><span class="fg">${mi(r.meters)} mi · ${r.locks} L<br>${dur(r.cruise)} · ${fmt(r.arrive)}</span></button>`}).join("")}</div>`;
    bindRoutePicker(w); w.querySelectorAll("[data-day]").forEach(x=>x.onclick=()=>{S.day=+x.dataset.day;save();setTab("today");fitDay(S.day);});
  } else if(seg==="vars"){

    w.innerHTML=routePicker()+`<p class="muted">Each choice changes ${esc(R.name)} only. Figures show the change to the whole week.</p>`+R.groups.map(g=>{const cur=S.choice[S.route][g.id]||"base";
      return `<div class="fork"><h3>${esc(g.q)}</h3>${g.opts.map(o=>{const ch={...S.choice[S.route],[g.id]:o.id}; const t=totals(simulate(composePlan(R,ch,S.over[S.route]),S.pace)); const dm=(t.m-base.m)/MI, dl=t.l-base.l, dc=t.c-base.c;
        const same=Math.abs(dm)<0.05&&dl===0&&Math.abs(dc)<2; const delta=o.id===cur?"Selected":same?"Same water, different night stops":`${dm>=0?"+":""}${dm.toFixed(1)} mi · ${dl>=0?"+":""}${dl} locks · ${dc>=0?"+":"-"}${dur(Math.abs(dc))}`;
        return `<button class="opt" role="radio" aria-checked="${o.id===cur}" data-g="${g.id}" data-o="${o.id}"><span class="radio"></span><b>${esc(o.label)}</b><span class="d">${esc(o.d)}</span><span class="delta">${delta}${t.bad?` · <span style="color:var(--bad)">${t.bad} problem${t.bad>1?"s":""}</span>`:""}</span></button>`}).join("")}</div>`}).join("");
    bindRoutePicker(w); w.querySelectorAll("[data-g]").forEach(x=>x.onclick=()=>{const g=x.dataset.g,o=x.dataset.o; if((S.choice[S.route][g]||"base")===o) return; change("Variation applied",()=>{S.choice[S.route][g]=o;});});
  } else {
    const st=(k,l,step,unit)=>`<div class="field"><span class="lbl">${l}</span><div class="stepper"><button data-pk="${k}" data-pd="${-step}">-</button><input type="number" step="${step}" data-pi="${k}" value="${S.pace[k]}" aria-label="${l}"><button data-pk="${k}" data-pd="${step}">+</button></div><span class="cap">${unit}</span></div>`;
    w.innerHTML=`<div class="seg">${Object.entries(PACES).map(([k,p])=>`<button data-pace="${k}" aria-pressed="${S.pace.n===p.n&&S.pace.lw===p.lw}">${p.label}</button>`).join("")}</div>
     ${st("n","Speed on narrow canals",0.1,"miles per hour")}${st("b","Speed on wide canals",0.1,"miles per hour")}${st("ln","Time per narrow lock",1,"minutes")}${st("lw","Time per wide lock",1,"minutes")}
     <p class="muted">After day 1, set these to what you really managed. Every later day is worked out again. Canalplan pace is about 2.45 mph and 11 minutes a lock.</p>
     <button class="btn" id="resetall">Clear all my day changes</button>`;
    w.querySelectorAll("[data-pace]").forEach(x=>x.onclick=()=>change("Pace set",()=>{const p=PACES[x.dataset.pace];S.pace={n:p.n,b:p.b,ln:p.ln,lw:p.lw};}));
    w.querySelectorAll("[data-pk]").forEach(x=>x.onclick=()=>change("Pace changed",()=>{const k=x.dataset.pk;S.pace[k]=Math.max(0.5,Math.round((S.pace[k]+(+x.dataset.pd))*10)/10);}));
    w.querySelectorAll("[data-pi]").forEach(x=>x.onchange=()=>{const v=parseFloat(x.value);if(v>0)change("Pace changed",()=>{S.pace[x.dataset.pi]=v;});});
    $("#resetall").onclick=()=>change("Cleared all day changes",()=>{S.over={A:{},B:{},C:{}};});
  }
}

   ${routePicker()}

function tableRows(f){let h="";
  RES.forEach((r,i)=>{ if(f!=="all"&&f!==i) return;
    h+=`<tr class="dayhead"><td class="sticky1" style="background:var(--beam-a)">Day ${i+1}</td><td colspan="${S.svc?9:8}">${DATES[i]} · ${esc(BYID[r.seq[0]].n)} to ${esc(r.night)} · ${mi(r.meters)} mi · ${r.locks} locks · ${dur(r.cruise)} · arrive ${fmt(r.arrive)}${r.msgs.filter(m=>m.k==="bad"||m.k==="warn").length?" · "+esc(r.msgs.filter(m=>m.k==="bad"||m.k==="warn").map(m=>m.lead).join("; ")):""}</td></tr>`;
    r.steps.forEach((s,k)=>{const n=BYID[s.id]; const key=isCheckpoint(n,s,k,r);
      if(!key&&!S.tall) return; const near=nearSights(n).slice(0,3).map(x=>x.p.n).concat(osmNear(n.lat,n.lon,0.6).filter(x=>["butcher","bakery","farmshop","deli","greengrocer"].includes(x.p.c)).slice(0,2).map(x=>x.p.n+" ("+OSMLABEL[x.p.c].toLowerCase()+")"));
      const notes=[...s.notes]; if(k===0) notes.unshift("Set off"); if(k===r.steps.length-1) notes.push("Night stop"); if(n.mo&&n.mo!=="unrated"&&(n.k==="moor"||k===r.steps.length-1)) notes.push("Mooring rated "+n.mo);
      h+=`<tr class="${key?"key":"minor"}" data-node="${n.id}"><td class="n sticky1">${fmt(s.t)}</td><td>${esc(n.n)}</td><td class="n">${bridgeNo(n.n)}</td><td>${n.k==="lock"?esc(lockInfo(n).pair):QUIET[n.n]?"Quiet mooring":KINDLABEL[n.k]}</td><td class="cn">${esc(WW[n.w].name.replace("Grand Union ","GU ").replace(" Canal",""))}</td><td class="n">${mi(s.m)}</td><td class="n">${s.l}</td>${S.svc?`<td>${esc(n.f||"")}</td>`:""}<td class="${s.notes.length?"warnc":""}">${esc(notes.join(" · "))}</td><td>${esc(near.join(", "))}</td></tr>`;});
  }); return h;}

const pickKey=(type,id)=>type==="sight"?"sight:"+id:"osm:"+OSM.pois[id].n+"@"+OSM.pois[id].p.join(",");
function pickFromKey(k){if(k.startsWith("sight:")){const p=POI.find(x=>x.id===k.slice(6));return p?{type:"sight",id:p.id,name:p.n,lat:p.lat,lon:p.lon,c:p.c,cv:"--c-"+p.c,icon:CATICON[p.c]}:null;}
  const j2=OSM.pois.findIndex(p=>"osm:"+p.n+"@"+p.p.join(",")===k); if(j2<0)return null; const p=OSM.pois[j2]; return {type:"osm",id:j2,name:p.n,lat:p.p[0],lon:p.p[1],c:p.c,cv:OSMCOL(p.c),icon:"dot"};}
function dayPicks(i){return ((S.picks[S.route]||{})[i])||[];}
function togglePick(key,i=S.day){S.picks[S.route]=S.picks[S.route]||{}; const a=S.picks[S.route][i]=S.picks[S.route][i]||[]; const at=a.indexOf(key); if(at>=0)a.splice(at,1); else a.push(key); save(); toast(at>=0?"Removed from day "+(i+1):"Added to day "+(i+1)+" plan");}
function nearestStep(r,lat,lon){let best=null,bd=1e9; for(const s of r.steps){const n=BYID[s.id]; const d=km(lat,lon,n.lat,n.lon); if(d<bd){bd=d;best=s;}} return {s:best,d:bd};}
function quietTonightHTML(i){const bad=r=>r.reduce((a,x)=>a+x.msgs.filter(m=>m.k==="bad"||m.k==="warn").length,0); const base=bad(RES); const opts=[];
  for(const q of Object.keys(QUIET)){ if(q===PLAN[i].night) continue; const plan=PLAN.map(x=>({...x,via:[...(x.via||[])]})); plan[i].night=q; const r=simulate(plan,S.pace);
    if(bad(r)>base||r[i].cruise<90||r[i].arrive>SUN[i][1]-30) continue; opts.push({q,arr:r[i].arrive,next:r[i+1]?r[i+1].cruise:0}); }
  if(!opts.length) return `<p class="cap">No quiet countryside mooring fits today without breaking a lock time or the return. Today needs a turning place or the yard.</p>`;
  opts.sort((a,b2)=>a.arr-b2.arr);
  return `<div class="field"><span class="lbl">Quiet countryside moorings that fit today</span><div class="list">${opts.slice(0,6).map(o=>`<button class="li" data-quiet="${esc(o.q)}"><span class="plaque" style="background:#2E7D5B">${ico("moon")}</span><span><span class="t">${esc(shortName(o.q))}</span><span class="s">${esc(QUIET_NOTE[QUIET[o.q]])}</span></span><span class="r">arrive ${fmt(o.arr)}</span></button>`).join("")}</div><span class="cap">Moor on the towpath side, not on a bend, under a bridge or at a lock. Bring a torch: no lights out here.</span></div>`;}
const ALONG=[["all","Everything"],["top","Top picks"],["nature","Nature"],["history","History"],["eat","Pubs and food"],["shops","Shops"],["villages","Villages"],["help","Post, pharmacy, toilets"],["quiet","Quiet moorings"]];
function alongItems(i,f,radius){const r=RES[i]; const out=[];
  POI.forEach(p=>{const ok=f==="all"||(f==="top"&&starsOf(p.id)>=2)||(f==="nature"&&p.c==="nature")||(f==="history"&&(p.c==="history"||p.c==="museum"))||(f==="eat"&&p.c==="pub")||(f==="shops"&&p.c==="food")||(f==="villages"&&p.c==="village"); if(!ok)return;
    const ns=nearestStep(r,p.lat,p.lon); if(ns.d<=radius) out.push({type:"sight",id:p.id,key:"sight:"+p.id,name:p.n,c:"--c-"+p.c,icon:CATICON[p.c],st:starsOf(p.id),sub:CATS[p.c],t:ns.s.t,node:BYID[ns.s.id],d:ns.d});});
  if(f!=="top"&&f!=="villages") OSM.pois.forEach((p,j2)=>{const grp=OSMGROUP.food.includes(p.c)?"shops":OSMGROUP.eat.includes(p.c)?"eat":OSMGROUP.heritage.includes(p.c)?"history":OSMGROUP.outdoors.includes(p.c)?"nature":"help"; if(f!=="all"&&f!==grp)return;
    const ns=nearestStep(r,p.p[0],p.p[1]); if(ns.d<=radius) out.push({type:"osm",id:j2,key:pickKey("osm",j2),name:p.n,c:OSMCOL(p.c),icon:"dot",st:0,sub:OSMLABEL[p.c]+(p.o?" · "+p.o:""),t:ns.s.t,node:BYID[ns.s.id],d:ns.d});});
  return out.sort((a,b2)=>a.t-b2.t||b2.st-a.st||a.d-b2.d);}
function alongRow(x,i){const on=dayPicks(i).includes(x.key);
  return `<div class="li" style="grid-template-columns:auto minmax(0,1fr) auto"><button class="plaque" style="background:var(${x.c});border:0" data-ct="${x.type}" data-cid="${x.id}" aria-label="Open ${esc(x.name)}">${ico(x.icon)}</button>
   <button style="border:0;background:none;text-align:left;padding:0;min-width:0" data-ct="${x.type}" data-cid="${x.id}"><span class="t">${esc(x.name)} ${x.st?starHTML(x.st):""}</span><span class="s">${esc(x.sub)}</span><span class="s">Pass ${fmt(x.t)} · ${x.d<0.1?"by the canal":x.d.toFixed(1)+" km from "+esc(shortName(x.node.n))}</span></button>
   <button class="iconbtn" data-pick="${esc(x.key)}" aria-pressed="${on}" aria-label="${on?"Remove from":"Add to"} day plan" style="${on?"background:var(--enamel);color:#fff":""}">${ico(on?"check":"plus")}</button></div>`;}
function viewPlaces(b){const pf=S.pf;
  if(S.pscope==="day"&&!S.pq.trim()){ const i=S.day, af=S.af||"all", rad=S.arad||1.5; const items=alongItems(i,af,rad);
    b.innerHTML=`<div class="sec"><div class="sticky" style="display:grid;gap:8px"><div class="seg"><button data-scope="day" aria-pressed="true">Along day ${i+1}</button><button data-scope="all" aria-pressed="false">Everywhere</button></div>
      <div class="days" role="group" aria-label="Day">${RES.map((r,k)=>`<button class="dayb" data-aday="${k}" aria-pressed="${k===i}"><span class="dw">${DSHORT[k][0]}</span><span class="dd">${DSHORT[k][1]}</span></button>`).join("")}</div>
      <div class="chips">${ALONG.map(([k,l])=>`<button class="chip" data-af="${k}" aria-pressed="${af===k}">${l}</button>`).join("")}</div>
      <div class="row" style="justify-content:space-between"><span class="cap">${items.length} places within ${rad} km of ${esc(shortName(BYID[RES[i].seq[0]].n))} to ${esc(shortName(RES[i].night))}, in the order you pass them.</span><div class="seg" style="width:auto">${[0.5,1.5,3].map(v=>`<button data-rad="${v}" aria-pressed="${rad===v}">${v} km</button>`).join("")}</div></div></div>
      <div class="list">${items.slice(0,250).map(x=>alongRow(x,i)).join("")||'<p class="muted" style="padding:16px">Nothing in this filter near the day&#39;s route.</p>'}</div>
      <p class="cap">Tap + to add a place to the day's plan. It stays off the route until you choose "Stop here" in Today.</p></div>`;
    b.querySelectorAll("[data-scope]").forEach(x=>x.onclick=()=>{S.pscope=x.dataset.scope;save();renderPanel();});
    b.querySelectorAll("[data-aday]").forEach(x=>x.onclick=()=>{S.day=+x.dataset.aday;save();refresh();fitDay(S.day);});
    b.querySelectorAll("[data-af]").forEach(x=>x.onclick=()=>{S.af=x.dataset.af;save();renderPanel();});
    b.querySelectorAll("[data-rad]").forEach(x=>x.onclick=()=>{S.arad=+x.dataset.rad;save();renderPanel();});
    b.querySelectorAll("[data-pick]").forEach(x=>x.onclick=()=>{togglePick(x.dataset.pick);renderPanel();});
    b.querySelectorAll("[data-ct]").forEach(x=>x.onclick=()=>openCard({type:x.dataset.ct,id:x.dataset.ct==="osm"?+x.dataset.cid:x.dataset.cid},true));
    return; }
  const F=[["top","Top picks"],["sights","All researched sights"],["lock","Locks"],["bridge","Bridges"],["turn","Turning places"],["moor","Moorings"],["service","Water and services"],["pub","Canal pubs"],["food","Butchers, bakers, shops"],["eat","Pubs, cafes, food"],["heritage","History and churches"],["outdoors","Nature and views"],["help","Post, pharmacy, toilets"]];
  b.innerHTML=`<div class="sec"><div class="sticky" style="display:grid;gap:8px"><div class="seg"><button data-scope="day" aria-pressed="false">Along day ${S.day+1}</button><button data-scope="all" aria-pressed="true">Everywhere</button></div><div style="position:relative"><input class="search" id="pq" type="search" placeholder="Search: bridge 85, water, butcher, castle" value="${esc(S.pq)}" aria-label="Search places" style="padding-left:40px"><span style="position:absolute;left:10px;top:12px;color:var(--ink-3)">${ico("search")}</span></div>
   <div class="chips">${F.map(([k,l])=>`<button class="chip" data-pf="${k}" aria-pressed="${pf===k}">${l}</button>`).join("")}</div></div><div class="list" id="plist"></div></div>`;
  b.querySelectorAll("[data-pf]").forEach(x=>x.onclick=()=>{S.pf=x.dataset.pf;save();renderPanel();});
  b.querySelectorAll("[data-scope]").forEach(x=>x.onclick=()=>{S.pscope=x.dataset.scope;if(S.pscope==="day")S.pq="";save();renderPanel();});
  const q=$("#pq"); q.oninput=()=>{S.pq=q.value;save();fill();}; fill();
  function fill(){const qq=S.pq.trim().toLowerCase(); let items=[];
    const match=s=>!qq||s.toLowerCase().includes(qq);
    if(qq){ // search everything
      POI.forEach(p=>{if(match(p.n+" "+p.t+" "+CATS[p.c]+" "+JSON.stringify(DETAIL[p.id]||{}))) items.push({type:"sight",id:p.id,c:p.c,t:p.n,s:CATS[p.c],r:"",st:starsOf(p.id)});});
      NODES.forEach(n=>{const b2=bridgeNo(n.n); if(match(n.n+" "+n.f+" "+(b2?"bridge "+b2:"")+" "+KINDLABEL[n.k])) items.push({type:"node",id:n.id,k:n.k,t:n.n,s:KINDLABEL[n.k]+(n.f?" · "+n.f:""),r:fromClifton(n)?mi(fromClifton(n).m)+" mi":""});});
      OSM.pois.forEach((p,j)=>{if(match(p.n+" "+OSMLABEL[p.c])) items.push({type:"osm",id:j,c:p.c,t:p.n,s:OSMLABEL[p.c]+" · OpenStreetMap",r:p.d+" km"});});
    } else if(pf==="top"){ POI.filter(p=>starsOf(p.id)>=2).sort((a,b2)=>starsOf(b2.id)-starsOf(a.id)).forEach(p=>items.push({type:"sight",id:p.id,c:p.c,t:p.n,s:CATS[p.c]+(STAR_WHY[p.id]?" · "+STAR_WHY[p.id]:""),r:"",st:starsOf(p.id)})); }
    else if(pf==="sights") POI.slice().sort((a,b2)=>starsOf(b2.id)-starsOf(a.id)).forEach(p=>items.push({type:"sight",id:p.id,c:p.c,t:p.n,s:CATS[p.c]+(p.s==="checked"?"":" · not checked"),r:"",st:starsOf(p.id)}));
    else if(OSMGROUP[pf]) OSM.pois.forEach((p,j)=>{if(OSMGROUP[pf].includes(p.c)) items.push({type:"osm",id:j,c:p.c,t:p.n,s:OSMLABEL[p.c]+(p.o?" · "+p.o:""),r:p.d+" km"});});
    else NODES.forEach(n=>{const ok=pf==="quiet"?!!QUIET[n.n]:pf==="service"?!!n.f:pf==="turn"?canTurn(n):n.k===pf; if(ok) items.push({type:"node",id:n.id,k:n.k,t:n.n,s:KINDLABEL[n.k]+(n.f?" · "+n.f:""),r:fromClifton(n)?mi(fromClifton(n).m)+" mi":""});});
    if(OSMGROUP[pf]&&!qq) items.sort((a,b2)=>parseFloat(a.r)-parseFloat(b2.r));
    $("#plist").innerHTML=items.slice(0,200).map(x=>{const icon=x.type==="node"?`<span class="plaque" style="background:var(--enamel);color:var(--on-enamel)">${ico(KINDICON[x.k]||"dot")}</span>`:x.type==="sight"?`<span class="plaque" style="background:var(--c-${x.c})">${ico(CATICON[x.c])}</span>`:`<span class="plaque" style="background:var(${OSMCOL(x.c)})">${ico("dot")}</span>`;
      return `<button class="li" data-ct="${x.type}" data-cid="${x.id}">${icon}<span><span class="t">${esc(x.t)} ${x.st?starHTML(x.st):""}</span><span class="s">${esc(x.s)}</span></span><span class="r">${esc(x.r)}</span></button>`}).join("")||`<p class="muted" style="padding:16px 0">Nothing matches. Try a shorter word.</p>`;
    $("#plist").querySelectorAll("[data-ct]").forEach(x=>x.onclick=()=>openCard({type:x.dataset.ct,id:x.dataset.ct==="osm"?+x.dataset.cid:x.dataset.cid},true));
    if(items.length>200) $("#plist").insertAdjacentHTML("beforeend",`<p class="cap" style="padding:8px 0">Showing 200 of ${items.length}. Search to narrow.</p>`);
  }
}

/* ---------- cards ---------- */
function openCard(c,fly){CARD=c; renderPanel(); if(!isDesk()&&SNAP!=="full") snap("half"); const ll=cardLL(c); if(ll&&MAP){ if(fly) MAP.flyTo(ll,Math.max(MAP.getZoom(),15),{duration:matchMedia("(prefers-reduced-motion: reduce)").matches?0:0.6}); markSel(ll);} $("#pbody").scrollTop=0;}
function cardLL(c){if(c.type==="node"){const n=BYID[c.id];return [n.lat,n.lon];} if(c.type==="sight"){const p=POI.find(x=>x.id===c.id);return [p.lat,p.lon];} if(c.type==="osm"){const p=OSM.pois[c.id];return p?p.p:null;} return null;}
function cardHTML(){const c=CARD; const back=`<button class="back" id="cback">${ico("back")} Back</button>`;
  if(c.type==="node"){const n=BYID[c.id]; const fc=fromClifton(n); const b=bridgeNo(n.n); const fl=FLIGHTS.find(f=>f.re.test(n.n));
    const passes=RES.map((r,i)=>{const s=r.steps.find(x=>x.id===n.id);return s?`Day ${i+1} (${DSHORT[i][0]}) at ${fmt(s.t)}`:null}).filter(Boolean);
    const near=sightsNear(n.lat,n.lon,2).slice(0,8), on=osmNear(n.lat,n.lon,1.2).slice(0,12);
    return `<div class="card">${back}<div><span class="plate">${b?`<span class="num">${b}</span>`:""}${esc(n.n)}</span></div>${n.d?`<p class="muted">${esc(n.d)}</p>`:""}
     <div class="facts"><span class="fact">${KINDLABEL[n.k]}</span><span class="fact">${esc(WW[n.w].name)}</span>${fc?`<span class="fact">${mi(fc.m)} mi, ${fc.l} locks from Clifton</span>`:""}${n.mo&&n.mo!=="unrated"?`<span class="fact">Mooring: ${esc(n.mo)}</span>`:""}${canTurn(n)?`<span class="fact" style="border-color:var(--ok);color:var(--ok)">You can turn here</span>`:""}</div>
     ${QUIET[n.n]?`<div class="msg ok">${ico("moon")}<b>Quiet countryside mooring</b><span>${esc(QUIET_NOTE[QUIET[n.n]])} Moor on the towpath side, not on a bend or under the bridge.</span></div>`:""}
     ${n.f?`<div class="msg info">${ico("drop")}<b>Services</b><span>${esc(n.f)}</span></div>`:""}
     ${fl?msgHTML({k:fl.key==="sutton"||fl.key==="watford"?"bad":"warn",lead:fl.name,t:fl.text}):""}
     ${passes.length?`<p><b>On ${esc(ROUTES[S.route].name)}:</b> ${passes.join(", ")}.</p>`:`<p class="muted">Not on ${esc(ROUTES[S.route].name)}.</p>`}
     ${mapBtns(n.lat,n.lon,n.n,false)}

     ${near.length?`<h3>Sights nearby</h3><div class="list">${near.map(x=>`<button class="li" data-ct="sight" data-cid="${x.p.id}"><span class="plaque" style="background:var(--c-${x.p.c})">${ico(CATICON[x.p.c])}</span><span><span class="t">${esc(x.p.n)} ${starHTML(starsOf(x.p.id))}</span><span class="s">${CATS[x.p.c]}</span></span><span class="r">${x.d.toFixed(1)} km</span></button>`).join("")}</div>`:""}
     ${on.length?`<h3>Shops, food and more (OpenStreetMap)</h3><div class="list">${on.map(x=>`<button class="li" data-ct="osm" data-cid="${OSM.pois.indexOf(x.p)}"><span class="plaque" style="background:var(${OSMCOL(x.p.c)})">${ico("dot")}</span><span><span class="t">${esc(x.p.n)}</span><span class="s">${OSMLABEL[x.p.c]}${x.p.o?" · "+esc(x.p.o):""}</span></span><span class="r">${x.d.toFixed(1)} km</span></button>`).join("")}</div>`:""}
     <p class="cap">Canal data from Canalplan, read 26 Oct 2026.</p></div>`;}
  if(c.type==="sight"){const p=POI.find(x=>x.id===c.id); const nn=byName(p.near); const d=DETAIL[p.id]||{}; const st=starsOf(p.id);

     ${mapBtns(p.lat,p.lon,p.n,true)}

     ${nn?`<div class="row"><button class="btn" data-ct="node" data-cid="${nn.id}">Leave the boat at ${esc(shortName(nn.n))}</button></div>`:""}

     <dl class="kv">${row("Allow",d.time)}${row("Best time",d.best)}${row("Open",d.open)}${row("Cost",d.cost)}${row("Food and drink",d.food)}${row("From the canal",d.walk||p.acc)}${row("Phone",d.phone||p.tel)}</dl>
     ${web?`<p><a href="${esc(web)}" target="_blank" rel="noopener">Website</a></p>`:""}
     ${d.tips&&d.tips.length?`<h3>Tips</h3>${li(d.tips)}`:""}
     ${d.facts&&d.facts.length?`<h3>Good to know</h3>${li(d.facts)}`:""}
     <p class="cap">Researched 26 Oct 2026. Opening hours change: phone ahead. ${srcs.map((s,k)=>`<a href="${esc(s)}" target="_blank" rel="noopener">Source ${k+1}</a>`).join(" · ")}</p></div>`;}
  if(c.type==="osm"){const p=OSM.pois[c.id];
    return `<div class="card">${back}<div><span class="plate cat" style="--catc:var(${OSMCOL(p.c)})">${ico("dot")}${esc(p.n)}</span></div>
     <div class="facts"><span class="fact">${OSMLABEL[p.c]}${p.h?" ("+esc(p.h)+")":""}</span><span class="fact">${p.d} km from the canal</span>${p.u?`<span class="fact">${esc(p.u)}</span>`:""}${p.x?`<span class="fact">Listed building</span>`:""}</div>
     ${mapBtns(p.p[0],p.p[1],p.n,true)}
     <div class="row"><button class="btn" id="cpick">${dayPicks(S.day).includes(pickKey("osm",c.id))?ico("check","i s")+" In day "+(S.day+1)+" plan":ico("plus","i s")+" Add to day "+(S.day+1)+" plan"}</button></div>
     ${p.o?`<p><b>Opening hours listed:</b> ${esc(p.o)}</p>`:`<p class="muted">No opening hours listed.</p>`}${p.t?`<p><b>Phone:</b> <span class="num" style="font-size:20px;user-select:all">${esc(p.t)}</span></p>`:""}${p.w?`<p><a href="${esc(p.w)}" target="_blank" rel="noopener">Website</a></p>`:""}
     <p class="cap">From OpenStreetMap, downloaded 26 Oct 2026. Not checked: confirm it is open before you walk.</p></div>`;}
  return back;}
function bindCard(){const b=$("#pbody"); $("#cback").onclick=()=>{CARD=null;clearSel();renderPanel();};
  const cp=$("#cpick"); if(cp) cp.onclick=()=>{togglePick(CARD.type==="sight"?"sight:"+CARD.id:pickKey("osm",CARD.id)); renderPanel();};
  b.querySelectorAll("[data-ct]").forEach(x=>x.onclick=()=>openCard({type:x.dataset.ct,id:x.dataset.ct==="osm"?+x.dataset.cid:x.dataset.cid},true));
  if(CARD.type==="node"){const n=BYID[CARD.id]; const i=S.day;
    $("#cnight").onclick=()=>change("Day "+(i+1)+" night stop: "+shortName(n.n),()=>{S.over[S.route][i]=Object.assign({},S.over[S.route][i]||{},{night:n.n});});
    $("#cvia").onclick=()=>change("Added to day "+(i+1),()=>{S.over[S.route][i]=Object.assign({},S.over[S.route][i]||{},{via:[...PLAN[i].via,n.n]});});
    $("#chere").onclick=()=>replanFrom(n.n,$("#ctime").value||nowHM());}}

/* ---------- map ---------- */
let MAP=null, L_=null, SELM=null;
const PANES=[["land",200],["built",210],["wood",220],["water",230],["rail",240],["roads",250],["casing",300],["canal",310],["route",320],["sel",330],["osmp",390],["labels",395],["marks",400],["nights",900],["selm",950]];
const LAYERS={};
function initMap(){
  if(typeof L==="undefined"){ $("#map").innerHTML=`<div style="padding:24px" class="muted">The map library could not load. Every other view still works.</div>`; return; }
  MAP=L.map("map",{zoomControl:false,preferCanvas:true,minZoom:10,maxZoom:18,zoomSnap:0.5,attributionControl:true,tap:true});
  MAP.attributionControl.setPrefix(false).addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · canal data Canalplan · <a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  PANES.forEach(([p,z])=>{MAP.createPane(p).style.zIndex=z;});
  L_={}; ["land","built","wood","water","rail","roads","casing","canal","route","sel","osmp"].forEach(p=>L_[p]=L.canvas({pane:p,padding:0.3,tolerance:8}));
  MAP.fitBounds(weekBounds(),padOpts());
  MAP.on("zoomend",()=>{styleMap();zoomVis();});
  MAP.on("click",()=>{const lp=$("#layerpop"); if(!lp.hidden){lp.hidden=true;$("#zlay").setAttribute("aria-expanded","false");return;} if(CARD){CARD=null;clearSel();renderPanel();}});
  $("#zin").onclick=()=>MAP.zoomIn(); $("#zout").onclick=()=>MAP.zoomOut();
  $("#zday").onclick=()=>fitDay(S.day); $("#zall").onclick=fitWeek;
  $("#zme").onclick=startGPS;
  $("#zlay").onclick=()=>{const p=$("#layerpop"); p.hidden=!p.hidden; $("#zlay").setAttribute("aria-expanded",!p.hidden); renderLayerPop();};
  buildCanalMarkers(); buildSights(); drawRoute(); setBase();
  if(!hasKey()){ setTimeout(()=>{ if(!isDesk()) snap("peek");const lp=$("#layerpop"); lp.hidden=false; $("#zlay").setAttribute("aria-expanded","true"); renderLayerPop();},900);}
  {const g=L.layerGroup(); Object.keys(QUIET).forEach(q=>{const n=byName(q); if(!n)return; const m=L.marker([n.lat,n.lon],{pane:"marks",title:"Quiet mooring: "+q,icon:L.divIcon({className:"mk quiet",html:`<span class="v"><svg><use href="#i-moon"/></svg></span>`,iconSize:[40,40],iconAnchor:[20,20]})}); m.on("click",e=>{L.DomEvent.stopPropagation(e);openCard({type:"node",id:n.id});}); m.addTo(g);}); LAYERS.quiet=g;}
  fetch("data/basemap.json").then(r=>r.json()).then(j=>{BASE=j;buildBase();styleMap();}).catch(()=>toast("Base map data did not load. The canal and plan still work."));
  fetch("data/osmpois.json").then(r=>r.json()).then(j=>{OSM=j;buildOsm();buildLabels();zoomVis();if(S.tab==="places"||CARD)renderPanel();}).catch(()=>{});
  zoomVis();
}
let GPSW=null, GPSFIRST=true;
function nearestNode(lat,lon){let best=null,bd=1e9; for(const n of NODES){const d=km(lat,lon,n.lat,n.lon); if(d<bd){bd=d;best=n;}} return {n:best,d:bd};}
function nearestBridge(lat,lon){let best=null,bd=1e9; for(const n of NODES){if(n.k!=="bridge"||!bridgeNo(n.n))continue; const d=km(lat,lon,n.lat,n.lon); if(d<bd){bd=d;best=n;}} return {n:best,d:bd};}
function startGPS(){
  if(GPSW!==null){navigator.geolocation.clearWatch(GPSW);GPSW=null;["me","meAcc"].forEach(k=>{if(LAYERS[k]){MAP.removeLayer(LAYERS[k]);delete LAYERS[k];}});$("#zme").classList.remove("on");toast("Stopped showing your position.");return;}
  if(!navigator.geolocation||!window.isSecureContext){askBridge("Location is not available here.");return;}
  GPSFIRST=true; $("#zme").classList.add("on");
  GPSW=navigator.geolocation.watchPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude], acc=p.coords.accuracy||50;
      if(!LAYERS.meAcc){LAYERS.meAcc=L.circle(ll,{radius:acc,pane:"sel",renderer:L_.sel,color:cssv("--enamel"),weight:1,fillColor:cssv("--enamel"),fillOpacity:.12,interactive:false}).addTo(MAP);
        LAYERS.me=L.marker(ll,{pane:"selm",interactive:false,icon:L.divIcon({className:"",html:'<span class="medot"></span>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(MAP);}
      else {LAYERS.meAcc.setLatLng(ll).setRadius(acc); LAYERS.me.setLatLng(ll);}
      HERE={lat:ll[0],lon:ll[1],acc}; renderStatus();
      if(GPSFIRST){GPSFIRST=false; MAP.flyTo(ll,Math.max(MAP.getZoom(),15)); const nb=nearestBridge(ll[0],ll[1]), nn=nearestNode(ll[0],ll[1]);
        if(nn.d<0.6){toast("You are near "+shortName(nn.n.n)+(nb.n&&nb.d<1.5?" · bridge "+bridgeNo(nb.n.n):"")); openCard({type:"node",id:nn.n.id});}
        else toast("You are "+nn.d.toFixed(1)+" km from the canal. Nearest: "+shortName(nn.n.n)+".");}
    },e=>{GPSW!==null&&navigator.geolocation.clearWatch(GPSW);GPSW=null;$("#zme").classList.remove("on");askBridge(e.code===1?"Location was refused.":"Your position is not available right now.");},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}
let HERE=null;
function askBridge(msg){toast(msg+" Type the bridge number you can see instead."); S.pq="bridge "; S.pf="bridge"; save(); CARD=null; setTab("places"); setTimeout(()=>{const q=$("#pq"); if(q){q.focus(); q.setSelectionRange(q.value.length,q.value.length);}},50);}
let TILES=null, TILEERR=0;
function mapKey(){try{return (localStorage.getItem("jacqueline.mapkey")||"").trim();}catch(e){return "";}}
const hasKey=()=>/^[A-Za-z0-9]{10,64}$/.test(mapKey());
const isDark=()=>S.theme==="dark"||(S.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
function tileStyle(){const b=S.base; if(b==="satellite") return "hybrid"; if(b==="outdoor") return isDark()?"outdoor-v2-dark":"outdoor-v2"; return isDark()?"streets-v2-dark":"streets-v2";}
function useTiles(){return hasKey()&&S.base!=="builtin"&&navigator.onLine!==false;}
function setBase(){if(!MAP)return; if(TILES){MAP.removeLayer(TILES);TILES=null;}
  if(useTiles()){TILEERR=0; TILES=L.tileLayer(`https://api.maptiler.com/maps/${tileStyle()}/256/{z}/{x}/{y}@2x.png?key=${mapKey()}`,{tileSize:256,maxZoom:19,crossOrigin:true,
      attribution:'<a href="https://www.maptiler.com/copyright/" target="_blank" rel="noopener">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">&copy; OpenStreetMap contributors</a>'}).addTo(MAP);
    TILES.on("tileerror",()=>{TILEERR++; if(TILEERR===6){toast("The online map is not loading. Showing the built-in map."); S.base="builtin"; setBase();}});}
  zoomVis(); styleMap();}
window.addEventListener("offline",()=>{if(TILES){setBase();}}); window.addEventListener("online",()=>setBase());
function renderLayerPop(){const p=$("#layerpop"); const L2=[["canal","Locks, bridges, moorings, turning places"],["quiet","Quiet countryside moorings"],["svc","Water and services"],["sights","Researched sights"],["osm","Shops, pubs and cafes (OpenStreetMap)"],["labels","Town and village names"]];
  const BS=hasKey()?[["streets","Map"],["outdoor","Outdoor"],["satellite","Satellite"],["builtin","Built-in"]]:[];
  p.innerHTML=(BS.length?`<div class="seg" style="margin:4px 4px 6px">${BS.map(([k,l])=>`<button data-base="${k}" aria-pressed="${S.base===k}">${l}</button>`).join("")}</div>`:"")+L2.map(([k,l])=>`<label><span>${l}</span><input type="checkbox" data-ly="${k}" ${S.layers[k]?"checked":""}></label>`).join("");
  if(!hasKey()) p.insertAdjacentHTML("afterbegin",`<div style="display:grid;gap:8px;padding:8px 6px 10px;border-bottom:1px solid var(--rule);margin-bottom:4px"><b style="font-size:15px">Detailed map</b><span class="cap">Paste your free MapTiler key to switch on the detailed map, outdoor footpaths and satellite. It stays on this device only.</span><div style="display:grid;gap:8px"><input class="search" id="mkey2" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="MapTiler key" aria-label="MapTiler key"><button class="btn primary" id="mkeysave2">Save</button><button class="btn" id="mkeylater">Not now</button></div></div>`);
  const kl=p.querySelector("#mkeylater"); if(kl) kl.onclick=()=>{p.hidden=true; $("#zlay").setAttribute("aria-expanded","false");};
  const ks=p.querySelector("#mkeysave2"); if(ks) ks.onclick=()=>{const v=p.querySelector("#mkey2").value.trim(); if(!/^[A-Za-z0-9]{10,64}$/.test(v)){toast("That does not look like a MapTiler key.");return;} try{localStorage.setItem("jacqueline.mapkey",v);}catch(e){} S.base="streets"; save(); setBase(); toast("Map key saved on this device."); renderLayerPop();};
  p.querySelectorAll("[data-base]").forEach(x=>x.onclick=()=>{S.base=x.dataset.base;save();setBase();renderLayerPop();});
  p.querySelectorAll("[data-ly]").forEach(x=>x.onchange=()=>{S.layers[x.dataset.ly]=x.checked;save();zoomVis();});}
function weekBounds(){const pts=[];RES.forEach(r=>r.seq.forEach(id=>{const n=BYID[id];pts.push([n.lat,n.lon]);}));return L.latLngBounds(pts);}
function padOpts(){return isDesk()?{paddingTopLeft:[(S.tab==="table"?40:$("#panel").offsetWidth+40),100],paddingBottomRight:[70,30]}:{paddingTopLeft:[20,90],paddingBottomRight:[60,Math.min($("#main").clientHeight*0.55,Math.max(60,sheetH()-snapY(SNAP)+100))]};}
function fitWeek(){if(MAP) MAP.fitBounds(weekBounds(),padOpts());}
function fitDay(i){if(!MAP)return; const r=RES[i]; const pts=r.seq.map(id=>[BYID[id].lat,BYID[id].lon]); if(pts.length>1) MAP.fitBounds(L.latLngBounds(pts),padOpts()); else MAP.setView(pts[0],14);}
function buildBase(){
  const A=BASE.areas, Ln=BASE.lines;
  const poly=(arr,p)=>arr.length?L.polygon(arr.map(a=>[a.g]),{pane:p,renderer:L_[p],interactive:false,stroke:false,fillOpacity:1,smoothFactor:1.2}):null;
  LAYERS.built=poly(A.built,"built"); LAYERS.wood=poly(A.wood,"wood"); LAYERS.water=poly(A.water,"water");
  const line=(arr,p,o={})=>arr.length?L.polyline(arr.map(a=>a.g),Object.assign({pane:p,renderer:L_[p],interactive:false,lineCap:"round",lineJoin:"round",smoothFactor:1.2},o)):null;
  LAYERS.river=line(Ln.river,"water"); LAYERS.rail=line(Ln.rail,"rail");
  ["minor","tertiary","secondary","primary","trunk","motorway"].forEach(c=>{LAYERS["e_"+c]=line(Ln[c],"roads"); LAYERS["r_"+c]=line(Ln[c],"roads");});
  LAYERS.canalCase=line(Ln.canal,"casing"); LAYERS.canal=line(Ln.canal,"canal");
  zoomVis();
}
const ZW=(z,a,b)=>Math.max(0,a+(b-a)*Math.min(1,Math.max(0,(z-10)/7)));
function styleMap(){if(!MAP)return; const z=MAP.getZoom(); const c=n=>cssv(n);
  document.getElementById("map").style.background=c("--m-land");
  const st=(k,o)=>{if(LAYERS[k]) LAYERS[k].setStyle(o);};
  st("built",{fillColor:c("--m-built")}); st("wood",{fillColor:c("--m-wood")}); st("water",{fillColor:c("--m-water")});
  st("river",{color:c("--m-river"),weight:ZW(z,1,4)});
  st("rail",{color:c("--m-rail"),weight:ZW(z,1,2.5),dashArray:z>=13?"6 4":null});
  const R={motorway:[2,9,"--m-motorway"],trunk:[1.6,8,"--m-trunk"],primary:[1.2,7,"--m-primary"],secondary:[0.8,6,"--m-secondary"],tertiary:[0.6,5,"--m-tertiary"],minor:[0.4,4,"--m-minor"]};
  for(const k in R){const [a,b,col]=R[k]; const w=ZW(z,a,b); st("e_"+k,{color:c("--m-roadedge"),weight:w+1.5}); st("r_"+k,{color:c(col),weight:w});}
  const cw=(TILES?0.6:1)*(z<11?3:z<13?4:z<15?6:z<17?8:10); st("canalCase",{color:c("--m-case"),weight:cw+3,opacity:TILES?0:1}); st("canal",{color:c("--m-canal"),weight:cw,opacity:TILES?.75:1});
  drawRoute(); if(LAYERS.osm) LAYERS.osm.eachLayer(m=>m.setStyle({fillColor:cssv(m.options.cvar),color:cssv("--m-case")}));
}
function zoomVis(){if(!MAP)return; const z=MAP.getZoom(); const T=!!TILES; const show=(k,on)=>{const l=LAYERS[k]; if(!l)return; if(T&&/^(built|wood|water|river|rail|e_|r_|lab_)/.test(k)) on=false; if(on&&!MAP.hasLayer(l)) l.addTo(MAP); else if(!on&&MAP.hasLayer(l)) MAP.removeLayer(l);};
  show("built",z>=10); show("wood",z>=10); show("water",true); show("river",z>=11); show("rail",z>=10);
  const RZ={motorway:10,trunk:10,primary:10,secondary:11,tertiary:12,minor:13}; for(const k in RZ){show("e_"+k,z>=Math.max(RZ[k],12)&&k!=="minor"); show("r_"+k,z>=RZ[k]);}
  show("canalCase",true); show("canal",true);
  const CZ={junction:11,lock:12,pub:12,tunnel:12,turn:13,moor:13,service:13,bridge:15}; for(const k in CZ) show("cm_"+k,(k==="service"?S.layers.svc:S.layers.canal)&&z>=CZ[k]);
  show("quiet",S.layers.quiet!==false&&z>=11.5); show("sights3",S.layers.sights&&z>=10.5); show("sights2",S.layers.sights&&z>=12); show("sights1",S.layers.sights&&z>=14); show("osm",S.layers.osm&&z>=14);
  show("lab_town",S.layers.labels&&z>=10); show("lab_village",S.layers.labels&&z>=12); show("lab_hamlet",S.layers.labels&&z>=14);
}
function divMk(ll,cls,inner,size,onclick,title){const m=L.marker(ll,{icon:L.divIcon({className:"mk "+cls,html:`<span class="v">${inner}</span>`,iconSize:[size,size],iconAnchor:[size/2,size/2]}),pane:cls.startsWith("night")?"nights":"marks",keyboard:true,title:title||"",riseOnHover:true}); if(onclick) m.on("click",e=>{L.DomEvent.stopPropagation(e);onclick();}); return m;}
function buildCanalMarkers(){const groups={};
  NODES.forEach(n=>{if(!["junction","lock","pub","tunnel","turn","moor","service","bridge"].includes(n.k))return; const g=groups[n.k]=groups[n.k]||L.layerGroup();
    const b=bridgeNo(n.n); const inner=n.k==="bridge"?b:n.k==="lock"||n.k==="junction"?"":`<svg><use href="#i-${KINDICON[n.k]}"/></svg>`;
    divMk([n.lat,n.lon],n.k,inner,n.k==="bridge"?40:44,()=>openCard({type:"node",id:n.id}),n.n).addTo(g);});
  for(const k in groups) LAYERS["cm_"+k]=groups[k];}
function buildSights(){const G={sights3:L.layerGroup(),sights2:L.layerGroup(),sights1:L.layerGroup()};
  POI.forEach(p=>{const st=starsOf(p.id); const g=G["sights"+(st>=3?3:st===2?2:1)];
    const m=L.marker([p.lat,p.lon],{pane:"marks",title:p.n,riseOnHover:true,zIndexOffset:st*100,icon:L.divIcon({className:"mk sight"+(p.s==="checked"?"":" not")+(st===3?" top":""),html:`<span class="v" style="background:var(--c-${p.c})"><svg><use href="#i-${CATICON[p.c]}"/></svg></span>`,iconSize:[44,44],iconAnchor:[22,22]})});
    m.on("click",e=>{L.DomEvent.stopPropagation(e);openCard({type:"sight",id:p.id});}); m.addTo(g);});
  Object.assign(LAYERS,G);}
function buildOsm(){const g=L.layerGroup(); OSM.pois.forEach((p,j)=>{const cv=OSMCOL(p.c); const m=L.circleMarker(p.p,{pane:"osmp",renderer:L_.osmp,radius:6,weight:2,color:cssv("--m-case"),fillColor:cssv(cv),fillOpacity:1,cvar:cv}); m.on("click",e=>{L.DomEvent.stopPropagation(e);openCard({type:"osm",id:j});}); m.bindTooltip(esc(p.n)+" · "+OSMLABEL[p.c],{direction:"top",offset:[0,-6]}); m.addTo(g);}); LAYERS.osm=g;}
function buildLabels(){const G={town:L.layerGroup(),village:L.layerGroup(),hamlet:L.layerGroup()};
  OSM.places.forEach(p=>{const k=p.k==="city"||p.k==="town"?"town":p.k==="village"?"village":"hamlet"; L.marker(p.p,{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="plabel ${k}">${esc(p.n)}</span>`,iconSize:[0,0]})}).addTo(G[k]);});
  LAYERS.lab_town=G.town; LAYERS.lab_village=G.village; LAYERS.lab_hamlet=G.hamlet;}
function drawRoute(){if(!MAP||!RES)return; ["routeAll","routeCase","routeSel","nights"].forEach(k=>{if(LAYERS[k]){MAP.removeLayer(LAYERS[k]);delete LAYERS[k];}});
  const z=MAP.getZoom(); const w=z<12?5:z<14?7:9; const col=cssv("--m-route");
  const all=L.layerGroup(); RES.forEach((r,i)=>{if(i===S.day||r.seq.length<2)return; L.polyline(r.seq.map(id=>[BYID[id].lat,BYID[id].lon]),{pane:"route",renderer:L_.route,color:col,weight:w,opacity:.35,interactive:false,lineCap:"round",lineJoin:"round"}).addTo(all);}); LAYERS.routeAll=all.addTo(MAP);
  const r=RES[S.day]; if(r.seq.length>1){const pts=r.seq.map(id=>[BYID[id].lat,BYID[id].lon]);
    LAYERS.routeCase=L.polyline(pts,{pane:"route",renderer:L_.route,color:"#FFFFFF",weight:w+6,opacity:.95,interactive:false,lineCap:"round",lineJoin:"round"}).addTo(MAP);
    LAYERS.routeSel=L.polyline(pts,{pane:"route",renderer:L_.route,color:col,weight:w+1,opacity:1,interactive:false,lineCap:"round",lineJoin:"round"}).addTo(MAP);
  }
  const ng=L.layerGroup(); const startN=BYID[RES[0].seq[0]]; divMk([startN.lat,startN.lon],"night","S",44,()=>openCard({type:"node",id:startN.id}),"Start: Clifton Wharf").addTo(ng);
  RES.forEach((r2,i)=>{if(i===6)return; const n=BYID[r2.seq[r2.seq.length-1]]; divMk([n.lat,n.lon],"night"+(i===S.day?" cur":""),String(i+1),44,()=>{S.day=i;save();refresh();openCard({type:"node",id:n.id});},"Night "+(i+1)+": "+n.n).addTo(ng);});
  LAYERS.nights=ng.addTo(MAP);}
function markSel(ll){clearSel(); SELM=L.circleMarker(ll,{pane:"selm",radius:20,color:cssv("--focus"),weight:3,fill:false,interactive:false}).addTo(MAP);}
function clearSel(){if(SELM&&MAP){MAP.removeLayer(SELM);SELM=null;}}

/* ---------- boot ---------- */
function refresh(){compute(); renderStatus(); renderTabs(); renderPanel(); drawRoute();}
applyTheme(); compute(); renderTabs(); renderStatus(); renderPanel();
requestAnimationFrame(()=>{snap(S.tab==="map"?"peek":S.tab==="table"?"full":"half",false); initMap();});

</script>
